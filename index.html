<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>您的品牌名稱 - 專業諮詢服務</title>
    <style>
        /* 基礎樣式設定 */
        :root {
            --primary-color: #2c3e50; /* 主題深藍色 */
            --accent-color: #3498db;  /* 強調藍色 */
            --text-color: #333;
            --light-bg: #f4f7f6;
        }

        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            color: var(--text-color);
        }

        /* 導覽列 */
        nav {
            background: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
        }

        /* 看板區 (Hero Section) */
        .hero {
            background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8)), 
                        url('https://images.unsplash.com/photo-1450101499163-c8848c66ca85?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            color: white;
            padding: 100px 5%;
            text-align: center;
        }

        .hero h1 { font-size: 3rem; margin-bottom: 20px; }

        /* 內容區塊 */
        section { padding: 80px 5%; max-width: 1200px; margin: auto; }
        .section-title { text-align: center; margin-bottom: 50px; }

        /* 服務項目網格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
